services:
  app:
    build: .
    ports: ["8082:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/reservations
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: reservations, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d reservations"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
